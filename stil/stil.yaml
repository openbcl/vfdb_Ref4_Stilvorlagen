# Einheitlicher Grafikstil fuer den vfdb-Leitfaden Ingenieurmethoden des Brandschutzes
#
# Einzige Quelle aller Stilwerte. Python-Paket (python/vfdb_stil), LaTeX-Paket
# (latex/vfdbstil-werte.tex, erzeugt) und Office-Vorlagen (office/, erzeugt) lesen
# ihre Werte von hier - Werte nur hier aendern und danach die Erzeugungsskripte
# ausfuehren (siehe CONTRIBUTING.md).
#
# Herkunft: abgeleitet aus den Abbildungen von Kapitel 4 des Leitfadens (in Bearbeitung)
# und der Praeambel des Leitfaden-Gesamtwerks (Textbreite, Schriften).
# Status: Entwurf - von der Redaktion noch nicht werkweit beschlossen.
#
# Einheiten: Laengen in mm, Linienstaerken und Schriftgroessen in pt (1 pt = 1/72 in).
# Der Abschnitt "regeln" am Ende beschreibt Vorgaben, die kein Werkzeug pruefen kann.

version: "0.1.0"

seite:                        # Leitfaden: report, 10pt, a4paper, geometry 3,0 / 2,5 cm
  textbreite_mm: 155.0        # 210 - 30 - 25; = Breite des Formats "breit"

schrift:
  text: "TeX Gyre Heros"      # wie \setmainfont im Leitfaden
  formel: "Fira Math"         # wie \setmathfont im Leitfaden
  # Schriftdateien (fuer die Pruefung auf Zeichen, die in der Schrift fehlen)
  text_datei: "texgyreheros-regular.otf"
  formel_datei: "FiraMath-Regular.otf"
  # Office (Excel/PowerPoint): Arial. TeX Gyre Heros (OpenType/CFF) bettet Office nicht als
  # Vektorschrift in PDF ein (Text wird Rasterbild). Arial hat dieselben Zeichenbreiten
  # (beide Helvetica-metrisch); nur die Form einzelner Buchstaben weicht ab.
  office: "Arial"
  groesse_pt:
    beschriftung: 9           # Achsentitel, Annotationen, Direktbeschriftung
    ticks: 8                  # Tick-Beschriftung
    legende: 8
  zeilenabstand: 1.1          # mehrzeilige Beschriftungen (Vielfaches der Schriftgroesse)

zahlen:
  dezimalzeichen: ","
  minuszeichen: "−"      # echtes Minus statt Bindestrich
  # Einstellungen fuer siunitx in den Abbildungen. Bewusst ohne die Rundung des
  # Leitfadens (round-precision=0 wuerde Dezimalzahlen in Abbildungen runden) und ohne
  # Tausendergruppierung.
  siunitx: "locale=DE, output-decimal-marker={,}, group-digits=none, per-mode=symbol"
  # Zahlen ab diesem Betrag (und unter exponent_unter, ausser 0) als a\cdot 10^n
  exponent_ab: 1.0e+6
  exponent_unter: 1.0e-4

# Formate: feste Achsenflaeche, Hoehe der Abbildung = Achsenflaeche + Raender je nach
# Inhalt (Legende, Phasenbalken). Einbinden in LaTeX ohne Skalierung:
#   \includegraphics{media/XX-name.pdf}
formate:
  standard:                   # Einzeldiagramm, 0,8 x Textbreite
    breite_mm: 124.0
    achse_b_mm: 103.0
    achse_h_mm: 64.0          # 103 : 64 ~ 1 : 0,618 (Goldener Schnitt)
    rand_links_mm: 17.0       # y-Tickbeschriftung + y-Achsentitel
    rand_rechts_mm: 4.0
    rand_oben_mm: 3.0         # Ueberstand oberste Tickbeschriftung
    rand_unten_mm: 10.0       # x-Ticks + x-Achsentitel (ohne Legende)
  zweifeldrig:                # zwei Felder uebereinander mit gemeinsamer x-Achse
    breite_mm: 124.0
    achse_b_mm: 103.0
    achse_h_mm: 40.0          # je Feld
    feldabstand_mm: 4.0
    rand_links_mm: 17.0
    rand_rechts_mm: 4.0
    rand_oben_mm: 3.0
    rand_unten_mm: 10.0
  breit:                      # volle Textbreite
    breite_mm: 155.0
    achse_b_mm: 134.0
    achse_h_mm: 82.8          # 134 : 82,8 ~ 1 : 0,618
    rand_links_mm: 17.0
    rand_rechts_mm: 4.0
    rand_oben_mm: 3.0
    rand_unten_mm: 10.0

achsen:
  linie_pt: 0.6
  farbe: text                 # Farbname aus "farben"
  oben_rechts: false          # nur linke und untere Achsenlinie
  datenrand: 0.0              # automatische Achsgrenzen ohne Zusatzrand (Anteil der Spanne)
  titel_abstand_y_mm: 12.0    # Achse -> zugewandte Kante des y-Achsentitels
  titel_abstand_x_mm: 5.0     # Achse -> Oberkante des x-Achsentitels
  ticks:
    richtung: innen           # innen | aussen
    laenge_pt: 3.0
    linie_pt: 0.6
    abstand_pt: 3.5           # Tick -> Beschriftung
    nebenticks: false
    hoechstens: 50            # mehr Teilstriche je Achse sind ein Eingabefehler
  gitter:
    sichtbar: true
    farbe: grau_hell          # Farbname aus "farben"
    linie_pt: 0.4
    hinter_daten: true

linien:
  daten_pt: 1.4
  duenn_pt: 1.0               # Nebenkurven in Schemata
  hilfslinie: {farbe: grau, stil: gestrichelt, linie_pt: 0.8}   # Farbname, Linienstilname
  marker_pt: 4.0              # Durchmesser

farben:
  # Kategorienpalette, feste Reihenfolge: Reihe 1 erhaelt immer Farbe 1 usw.;
  # Farben nie zyklisch neu vergeben. Bei mehr als 8 Reihen: zusammenfassen oder
  # auf mehrere Felder aufteilen.
  # Herkunft: allgemeine Referenzpalette fuer Datenvisualisierung. Unterscheidbarkeit
  # benachbarter Reihen (auch bei Farbsehschwaeche) mit vfdb-farbpruefung rechnerisch
  # geprueft; nicht benachbarte Paare sind teils schwach (deutlich 2/8 fuer alle, 2/6 und
  # 1/7 bei Rot-Gruen-Schwaeche; knapp 1/7, 2/4, 2/5, 5/8 fuer Normalsichtige, 3/5, 3/8, 6/8
  # bei Rot-Gruen-Schwaeche). Blau-Gelb-Schwaeche (selten, vom Werkzeug nur angegeben):
  # deutlich 4/5 und 2/8, knapp 6/7, 1/6, 2/5. Schwache Paare werden
  # bei Linien durch den Linienstil unterschieden (Punktdarstellungen: wenige Reihen). Ggf. durch
  # vfdb-Hausfarben ersetzen (Entscheidung der Redaktion).
  kategorien: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100",
               "#e87ba4", "#008300", "#6250d6", "#e34948"]
  kategorien_namen: [blau, orange, tuerkis, gelb, rosa, gruen, violett, rot]
  text: "#0b0b0b"
  grau: "#52514e"             # sekundaere Schrift, Hilfslinien
  grau_hell: "#d9d8d4"        # Gitter
  grau_flaeche: "#ecebe7"     # Hinterlegungen, Flaechen unter Kurven
  flaeche_deckkraft: 0.18     # farbige Flaechen (z. B. Objektbrand) in Reihenfarbe

linienstile:
  # zweites Unterscheidungsmerkmal neben der Farbe (Druck in Graustufen,
  # Farbsehschwaeche); Reihenfolge wie farben.kategorien.
  # Ohne "muster": Strichmuster von matplotlib (gestrichelt 3,7/1,6; gepunktet 1/1,65;
  # strichpunkt 6,4/1,6/1/1,6). Muster in Vielfachen der Linienstaerke (Strich, Luecke, ...).
  - {name: durchgezogen}
  - {name: gestrichelt}
  - {name: gepunktet}
  - {name: strichpunkt}
  - {name: strich-punkt-punkt, muster: [5, 1.5, 1, 1.5, 1, 1.5]}
  - {name: fein-gepunktet, muster: [1, 1]}
  - {name: lang-gestrichelt, muster: [9, 2.5]}
  - {name: durchgezogen}      # Reihe 8: vorlaeufig durchgezogen (unterscheidet sich von Reihe 1 durch Rot)

legende:
  rahmen: false
  abstand_mm: 11.5            # Achse -> Oberkante Legende
  zeile_mm: 4.25              # Zeilenhoehe (8 pt)
  zuschlag_unten_mm: 1.0      # unter der letzten Legendenzeile bis zum Abbildungsrand
                              # unterer Rand mit Legende = abstand + Zeilen x zeile + zuschlag
  symbollaenge_em: 2.4        # Laenge des Liniensymbols (em der Legendenschrift)
  textabstand_em: 0.8         # Liniensymbol -> Text
  spaltenabstand_em: 1.2      # Text -> naechste Spalte
  # Spaltenzahl nach Zahl der Eintraege (Eintraege: Spalten); mehr Eintraege: letzte Angabe.
  # Passt die Legende nicht in die Breite, werden Spalten zusammengelegt.
  spalten: {1: 1, 2: 2, 3: 3, 4: 2, 5: 3}

pfeile:                       # Schemata: Pfeilachsen, Hinweise, Bemassung
  linie_pt: 0.6
  farbe: text                 # Farbname aus "farben"
  achse:   {spitze_laenge_pt: 3.6}   # matplotlib: "-|>", mutation_scale 9
  hinweis: {spitze_laenge_pt: 2.8, abstand_text_pt: 1.0, abstand_ziel_pt: 1.5}
  mass:    {spitze_laenge_pt: 2.4, beidseitig: true}
  # Spitze gefuellt, so breit wie lang; Spitzenlaenge = 0,4 x mutation_scale (matplotlib)

schema:
  phasenbalken_mm: 8.0        # Massspfeil der Phasen unter der Zeitachse
  phasengrenze_oben_mm: 1.4   # Grenzstrich reicht ueber den Massspfeil hinaus ...
  phasengrenze_unten_mm: 0.8  # ... und darunter
  phasentext_mm: 1.3          # Massspfeil -> Oberkante des Phasentexts

regeln:                       # beschreibend, von keinem Werkzeug gelesen
  - Vektorgrafik (PDF) mit eingebetteter Schrift; keine Rastergrafik fuer Diagramme und Schemata.
  - Dateiname media/XX-name.pdf (XX = Kapitelnummer), Einbinden ohne Skalierung.
  - Keine Diagramme mit zwei y-Achsen; stattdessen zweifeldrig uebereinander.
  - Direktbeschriftungen innerhalb der Achsenflaeche; Texte ueberlappen sich nicht und ragen nicht ueber den Rand.
  - Kein Gesamttitel in der Abbildung; er steht in der Bildunterschrift (\caption). Feldtitel (9 pt) nur zur Unterscheidung mehrerer Felder.
  - 'Achsentitel: "Groesse Symbol in Einheit", z. B. "Gastemperatur T in °C"; reicht der Platz nicht (zweifeldrig), Symbol und Einheit, die Groesse nennt die Bildunterschrift.'
  - Legende unter der Abbildung, zeilenweise in Lesereihenfolge; bei nur einer Reihe keine Legende.
  - Hinweispfeile waagerecht oder senkrecht; keine fast senkrechten oder fast waagerechten Pfeile.
  - In Schemata Achsen als Pfeile ohne Gitter und Tick-Striche; Beschriftung der Zeitachse rechtsbuendig unter der Pfeilspitze.
  - Formelzeichen wie im Text des Leitfadens (kursiv bzw. nach Festlegung der Redaktion).
